<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>НЕЗЕФИР — Долги</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифты грузим без блокировки отрисовки: если Google Fonts медленный или
     недоступен, страница сразу открывается системным шрифтом. -->
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* ──────────────────────────────────────────────────────────────────────
     «ЧЕРТЁЖ» — тёмная и светлая палитры из утверждённого макета.
     Тёмная — по умолчанию, светлая — класс .lt на <html>
     (ставится в JS: tg.colorScheme / prefers-color-scheme / ?theme=light).
  ────────────────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg:#0A0D12; --pnl:rgba(13,17,24,.78); --hotbg:rgba(13,17,24,.82);
    --ink:#E8ECF2; --soft:rgba(232,236,242,.7); --muted:rgba(232,236,242,.56);
    --sub:rgba(232,236,242,.36); --faint:rgba(232,236,242,.30);
    --line:rgba(232,236,242,.13); --line2:rgba(232,236,242,.22);
    --blue:#3D7BFF; --hi:#8FB2FF; --blueA:rgba(61,123,255,.18);
    --or:#FF6A3D; --orA:rgba(255,106,61,.18); --gr:#3DD68C;
    --g1:rgba(120,160,255,.045); --g2:rgba(120,160,255,.09);
    --bar:rgba(14,18,25,.86); --shadow:0 10px 30px rgba(0,0,0,.5);
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    /* нижнее меню: высота и отступ снизу с учётом «чёлки» снизу (safe-area) */
    --navh:58px;
    --navb:max(20px, calc(env(safe-area-inset-bottom, 0px) + 10px));
    color-scheme: dark;
  }
  :root.lt {
    --bg:#EEF1EE; --pnl:rgba(255,255,255,.88); --hotbg:rgba(255,255,255,.96);
    --ink:#0E1A2B; --soft:rgba(14,26,43,.74); --muted:rgba(14,26,43,.62);
    --sub:rgba(14,26,43,.48); --faint:rgba(14,26,43,.40);
    --line:rgba(14,26,43,.12); --line2:rgba(14,26,43,.26);
    --hi:#1F5FE0; --blueA:rgba(61,123,255,.11);
    --or:#E2541F; --orA:rgba(255,106,61,.13); --gr:#13895A;
    --g1:rgba(31,95,224,.06); --g2:rgba(31,95,224,.13);
    --bar:rgba(255,255,255,.93); --shadow:0 8px 24px rgba(14,26,43,.12);
    color-scheme: light;
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: Onest, Inter, -apple-system, 'Segoe UI', Arial, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    /* сетка «чертежа»: крупная клетка 80px и мелкая 16px */
    background-image:
      linear-gradient(var(--g2) 1px, transparent 1px),
      linear-gradient(90deg, var(--g2) 1px, transparent 1px),
      linear-gradient(var(--g1) 1px, transparent 1px),
      linear-gradient(90deg, var(--g1) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    background-position: -1px -1px;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0;
           cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
  h1 { margin: 0; font: inherit; }
  svg { flex: none; }

  /* ─── КАРКАС: один экран за раз, свой скролл у каждого ───────────────── */
  #app { position: fixed; left: 0; right: 0; top: 0; height: var(--tg-viewport-stable-height, 100%); }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .col { max-width: 480px; margin: 0 auto; min-height: 100%;
         display: flex; flex-direction: column; gap: 10px;
         padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .col.main { padding-top: calc(18px + env(safe-area-inset-top, 0px));
              padding-bottom: calc(var(--navh) + var(--navb) + 12px); }

  /* ─── ТИПОГРАФИКА И ОБЩИЕ БЛОКИ (из макета) ─────────────────────────── */
  .m   { font-family: var(--mono); }
  .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); }
  .sub { font-family: var(--mono); font-size: 9.5px; color: var(--sub); line-height: 1.45; }
  .pnl { border-radius: 18px; border: 1px solid var(--line); background: var(--pnl); }
  .hot { border-radius: 18px; border: 1px solid var(--blue); background: var(--hotbg);
         box-shadow: 0 0 0 4px rgba(61,123,255,.08), 0 0 28px rgba(61,123,255,.12); }
  .btn { height: 50px; border-radius: 16px; background: var(--blue); color: #fff;
         display: flex; align-items: center; justify-content: center; gap: 8px;
         font-size: 15px; font-weight: 600; text-align: center; width: 100%;
         box-shadow: 0 0 18px rgba(61,123,255,.35); }
  .btn2 { height: 50px; border-radius: 16px; border: 1px solid var(--line2); background: var(--pnl);
          color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px;
          font-size: 15px; font-weight: 500; text-align: center; width: 100%; }
  .btn:active, .btn2:active, .rnd:active, .tab:active, .row:active { opacity: .8; }
  .rnd { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line2); background: var(--pnl);
         display: flex; align-items: center; justify-content: center; color: var(--ink); flex: none; }
  .title { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
  .hi { color: var(--hi); } .or { color: var(--or); } .ink { color: var(--ink); }
  .gr { color: var(--gr); } .soft { color: var(--soft); }
  .hgrp { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; min-width: 0; }
  .sb { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .nw { white-space: nowrap; }
  .back { display: flex; align-items: center; gap: 4px; height: 36px; font-size: 15px; font-weight: 500;
          color: var(--hi); align-self: flex-start; padding-right: 12px; }
  .note { font-size: 12.5px; line-height: 1.45; text-align: center; padding: 0 8px; }
  .link { align-self: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
          color: var(--hi); padding: 8px; }

  /* ─── ГЛАВНЫЙ ЭКРАН ─────────────────────────────────────────────────── */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 0 2px; }
  .card { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .big { display: flex; align-items: flex-start; gap: 6px; }
  .bignum { font-size: clamp(34px, 11.4vw, 44px); font-weight: 600; letter-spacing: -.03em; line-height: 1;
            white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cur { font-size: 14px; padding-top: 4px; }
  .hr { height: 1px; background: var(--line); }
  .cfoot { font-size: 10.5px; letter-spacing: .04em; }
  .state { padding: 18px 16px; display: flex; flex-direction: column; gap: 8px; }

  /* шкала-линейка «погашено %» */
  .rl { position: relative; height: 36px; margin-top: 12px; }
  .rl-mi { position: absolute; left: 0; right: 0; top: 8px; height: 6px;
           background-image: linear-gradient(90deg, var(--faint) 1px, transparent 1px); background-size: 2% 100%; }
  .rl-ma { position: absolute; left: 0; right: 0; top: 0; height: 14px;
           background-image: linear-gradient(90deg, var(--line2) 1px, transparent 1px); background-size: 10% 100%;
           border-right: 1px solid var(--line2); }
  .rl-fill { position: absolute; left: 0; top: 16px; height: 4px; background: var(--blue);
             box-shadow: 0 0 6px 1px rgba(61,123,255,.85); }
  .rl-ptr { position: absolute; top: -4px; width: 1px; height: 26px; background: var(--or); }
  .rl-tri { position: absolute; top: -10px; width: 0; height: 0; border-left: 4.5px solid transparent;
            border-right: 4.5px solid transparent; border-top: 6px solid var(--or); }
  .rl-lb { position: absolute; left: 0; right: 0; top: 23px; display: flex; justify-content: space-between;
           font-family: var(--mono); font-size: 9.5px; color: var(--faint); }

  .duo { display: flex; gap: 8px; }
  .duo > * { flex: 1; min-width: 0; }

  /* панель со списками: растягивается до меню, список листается внутри */
  .lists { flex: 1 1 0; min-height: 280px; padding: 6px 8px 0; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line); flex: none; }
  .lt2 { flex: 1; min-width: 0; height: 34px; border-radius: 10px; color: var(--muted); text-align: center;
         font-family: var(--mono); font-size: 10px; letter-spacing: .05em; white-space: nowrap; }
  .lt2 .n { opacity: .6; }
  .lt2.on { background: var(--blueA); color: var(--hi); box-shadow: inset 0 0 0 1px var(--blue); }
  .lbody { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 6px; }
  .lhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0 4px; flex: none; }
  .lsum { padding: 10px 0 4px; flex: none; line-height: 1.5; }
  .fl { flex: none; height: 30px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line2);
        color: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; white-space: nowrap; }
  .list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
          padding-bottom: 6px; }
  .drow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0;
          border-bottom: 1px solid var(--line); }
  .drow:last-child { border-bottom: none; }
  .dn { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .dname { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .dsum { font-family: var(--mono); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { padding: 28px 0; text-align: center; font-size: 14px; color: var(--soft); }

  /* нижнее меню-капсула */
  .nav { position: absolute; left: max(14px, calc(50% - 226px)); right: max(14px, calc(50% - 226px));
         bottom: var(--navb); height: var(--navh); border-radius: 29px; border: 1px solid var(--line2);
         background: var(--bar); box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
         -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); overflow: hidden; }
  .tab { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink);
         font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; white-space: nowrap; }
  .tab svg { color: var(--hi); }
  .tab + .tab { border-left: 1px solid var(--line); }

  /* ─── ПОДДЕРЖАТЬ ────────────────────────────────────────────────────── */
  .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--blueA); color: var(--hi);
         display: flex; align-items: center; justify-content: center; flex: none; }
  .ico.o { background: var(--orA); color: var(--or); }
  .ico.s { width: 36px; height: 36px; border-radius: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
         color: var(--ink); width: 100%; }
  .row:last-child { border-bottom: none; }
  .row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .t { font-size: 15.5px; font-weight: 500; line-height: 1.25; }
  .num { font-family: var(--mono); font-size: 10px; color: var(--sub); width: 16px; flex: none; }

  /* ─── РЕКЛАМА ───────────────────────────────────────────────────────── */
  .steps { display: flex; justify-content: space-between; gap: 4px; padding: 2px 2px 0; }
  .step { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9.5px;
          letter-spacing: .04em; color: var(--sub); white-space: nowrap; }
  .step b { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line2); display: flex;
            align-items: center; justify-content: center; font-weight: 500; flex: none; }
  .step.on { color: var(--hi); }
  .step.on b { border-color: var(--blue); background: var(--blueA); }
  .opt { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px;
         border: 1px solid var(--line2); color: var(--ink); width: 100%; text-align: left; }
  .opt.on { border-color: var(--blue); background: var(--blueA); }
  .opt .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line2); flex: none; }
  .opt.on .dot { border: 5px solid var(--blue); }

  /* ─── ДОНАТ ─────────────────────────────────────────────────────────── */
  .seg { flex: 1; height: 44px; border-radius: 12px; border: 1px solid transparent; color: var(--muted);
         font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
  .seg.on { border-color: var(--blue); background: var(--blueA); color: var(--hi); }
  .chips { display: grid; gap: 6px; }
  .chip { height: 50px; border-radius: 14px; border: 1px solid var(--line2); color: var(--ink);
          font-family: var(--mono); font-size: 15px; width: 100%; text-align: center; white-space: nowrap; }
  .chip.on { border-color: var(--blue); background: var(--blueA); color: var(--hi); box-shadow: 0 0 14px rgba(61,123,255,.25); }
  .tgl { width: 52px; height: 32px; border-radius: 16px; background: var(--line2); position: relative; flex: none; }
  .tgl.on { background: var(--blue); box-shadow: 0 0 12px rgba(61,123,255,.45); }
  .tgl i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff;
           transition: left .15s; }
  .tgl.on i { left: 23px; }
  .trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }

  /* ─── LINTU / ПУЛЬТ ─────────────────────────────────────────────────── */
  .stp { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .stp:last-child { border-bottom: none; }
  .stp b { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--hi); width: 22px; height: 22px;
           border-radius: 50%; border: 1px solid var(--blue); display: flex; align-items: center; justify-content: center; flex: none; }
  .frow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .frow:last-child { border-bottom: none; }

  /* ─── ПРИГЛАСИ ДРУГА ────────────────────────────────────────────────── */
  .rule { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.4; }
  .rule b { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--blue); color: var(--hi);
            font: 500 11px 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: center; }
  .thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .thumbs > * { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; object-fit: cover; display: flex;
                align-items: center; justify-content: center; background: var(--orA); color: var(--or); box-sizing: border-box; border: 1px solid var(--line); }
  .prz-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 8px 0 12px; }
  .prz { box-sizing: border-box; min-height: 132px; padding: 12px; border-radius: 16px; border: 1px solid var(--line2);
         background: var(--pnl); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .prz-i { width: 46px; height: 46px; border-radius: 13px; background: var(--orA); color: var(--or);
             display: flex; align-items: center; justify-content: center; flex: none; }
  .prz-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; display: block; background: var(--orA); }
  .prz-t { font-size: clamp(14px, 4.1vw, 16px); font-weight: 600; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; }
  .prz-t.none { font-size: 14.5px; font-weight: 500; color: var(--soft); }
  .rk { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rk:last-child { border-bottom: none; }

  /* ─── ПОДЕЛИТЬСЯ: карточка всегда тёмная, как картинка ──────────────── */
  .scard { border-radius: 16px; border: 1px solid #3D7BFF; padding: 14px; color: #E8ECF2; background-color: #0A0D12;
           background-image: linear-gradient(rgba(120,160,255,.09) 1px, transparent 1px),
                             linear-gradient(90deg, rgba(120,160,255,.09) 1px, transparent 1px),
                             linear-gradient(rgba(120,160,255,.045) 1px, transparent 1px),
                             linear-gradient(90deg, rgba(120,160,255,.045) 1px, transparent 1px);
           background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
           box-shadow: 0 0 24px rgba(61,123,255,.18); display: flex; flex-direction: column; gap: 8px; }
  .scard .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; color: rgba(232,236,242,.56); }
  .scard .w { color: #E8ECF2; }

  /* узкие экраны (iPhone SE и т.п.) */
  @media (max-width: 359px) {
    .col { padding-left: 14px; padding-right: 14px; }
    .btn, .btn2 { font-size: 14px; gap: 6px; }
    .title { font-size: 30px; }
    .tab { gap: 6px; font-size: 10px; letter-spacing: .04em; }
    .lt2 { font-size: 9.5px; letter-spacing: .03em; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script id="data" type="application/json">{}</script>
<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const DEBT_BOT_USERNAME = 'nezefir_debt_bot';
const BOT = `https://t.me/${DEBT_BOT_USERNAME}`;
const MINIAPP_URL = `https://t.me/${DEBT_BOT_USERNAME}/debts`;
// Призы розыгрыша «Пригласи друга»: всегда 4. Пустое t — «Приз ещё не выбран»; img — фото из assets/.
const RAFFLE_PRIZES = [
  { t: 'Набор из 5 дрип-пакетов', img: 'assets/prize-drip.jpg' },
  { t: 'Брелок-кофемолка «Mahlkönig EK43»', img: 'assets/prize-keychain.jpg' },
  { t: '250 баллов на бонусную карту Lintu', img: 'assets/prize-points.jpg' },
  { t: 'Печенье «Юбилейное» с глазурью', img: 'assets/prize-cookies.jpg' },
];
const LINTU_IOS     = 'https://apps.apple.com/ru/app/lintu/id6738983857';
const LINTU_ANDROID = 'https://play.google.com/store/apps/details?id=com.linty.app';
const LINTU_SITE    = 'https://lintu-coffee.ru';
const PULT_SITE     = 'https://pultbot.ru';
// Tribute: разовый донат и подписки рублями (сумма → код ссылки)
const TRIBUTE_ONCE    = 'https://t.me/tribute/app?startapp=dJwg';
const TRIBUTE_MONTHLY = { 300: 'https://t.me/tribute/app?startapp=sTXH',
                          500: 'https://t.me/tribute/app?startapp=s1e2',
                          1000: 'https://t.me/tribute/app?startapp=sTXK' };
// Картинка для сторис. Пока её нет — кнопка «В сторис» не показывается.
const STORY_IMAGE_URL = '';

// ─── TG INIT ──────────────────────────────────────────────────────────────────
const tg = window.Telegram && window.Telegram.WebApp;
// telegram-web-app.js создаёт WebApp и в обычном браузере, поэтому «мы в Telegram»
// проверяем по initData / платформе, а не по наличию объекта.
const inTg = !!(tg && (tg.initData || (tg.platform && tg.platform !== 'unknown')));
function verOk(v) {
  try { return inTg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v); }
  catch (e) { return false; }
}

// Тему можно форсировать в адресе: ?theme=light или ?theme=dark (для проверки).
const FORCED_THEME = (() => {
  try {
    const t = new URLSearchParams(location.search).get('theme');
    return t === 'light' || t === 'dark' ? t : null;
  } catch (e) { return null; }
})();

function isDark() {
  if (FORCED_THEME) return FORCED_THEME === 'dark';
  if (inTg) return tg.colorScheme === 'dark';
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}

function applyTheme() {
  const dark = isDark();
  document.documentElement.classList.toggle('lt', !dark);
  const bg = dark ? '#0A0D12' : '#EEF1EE';
  if (inTg) {
    try {

async function fetchFreshData() {

// ─── CALC ─────────────────────────────────────────────────────────────────────
function calcCurrentDebt(d) {
  if (!d.rate) return d.amount;
  const now = new Date();
  // НОВАЯ модель: проценты капают на текущее тело со дня последнего расчёта
  // (колонка O) и складываются с перенесённым остатком (колонка P).
  if (d.lastAccrual) {
    const base = new Date(d.lastAccrual);
    if (!isNaN(base.getTime())) {
      const days = Math.max(0, Math.floor((now - base) / 86400000));
      return d.amount + Math.max(0, (d.carriedInterest || 0)
                                    + d.amount * (d.rate / 100) * (days / 365));
    }
  }
  // Старая модель для строк, где O ещё пустая. Она верна, пока тело долга не
  // уменьшалось; после частичной выплаты, срезающей тело, начисление
  // «замерзало» — ради этого и вводились O/P.
  if (!d.startDate) return d.amount;
  const start = new Date(d.startDate);
  if (isNaN(start.getTime())) return d.amount;
  const days = Math.max(0, Math.floor((now - start) / 86400000));
  const accruedTotal   = d.amount * (d.rate / 100) * (days / 365);
  const unpaidInterest = Math.max(0, accruedTotal - (d.paidInterest || 0));
  return d.amount + unpaidInterest;
}
function calcAccrued(d) { return calcCurrentDebt(d) - d.amount; }
function fmt(n) { return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(n); }
function money(n) { return fmt(n) + ' ₽'; }
function pad2(n) { return String(n).padStart(2, '0'); }
// '2026-11-12' → '12.11.26' (без new Date, чтобы часовой пояс не сдвигал день)
function shortDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  return m ? `${m[3]}.${m[2]}.${m[1].slice(2)}` : '';
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Все цифры экрана — из одних данных. Пересчитывается на каждой отрисовке
// (проценты зависят от текущей даты).
function model() {
  const D = S.data;
  if (!D) return null;
  const open   = D.debts.filter(d => d.status !== 'closed');
  const closed = D.debts.filter(d => d.status === 'closed');

  const total        = open.reduce((s, d) => s + calcCurrentDebt(d), 0);
  const totalAccrued = open.reduce((s, d) => s + calcAccrued(d), 0);
  const totalPaid    = D.payments.reduce((s, p) => s + p.amount, 0);
  const reservedTotal = open.reduce((s, d) => s + (d.reserved > 0 ? d.reserved : 0), 0);

  // Сумма всех выплат по нику. Платежи в data.json привязаны к нику (creditor),
  // а не к строке долга; для закрытого долга это и есть полная погашенная сумма.
  // (В колонке D закрытого долга лежит лишь остаток перед последним платежом.)
  const paidByNick = {}, lastByNick = {};
  for (const p of D.payments) {
    paidByNick[p.creditor] = (paidByNick[p.creditor] || 0) + p.amount;
    const ds = String(p.date || '');
    if (ds && (!lastByNick[p.creditor] || ds > lastByNick[p.creditor])) lastByNick[p.creditor] = ds;
  }
  // % погашено от общей исторической суммы (текущий долг + уже выплачено)
  const paidDenom = total + totalPaid;
  const paidPct   = paidDenom > 0 ? Math.round((totalPaid / paidDenom) * 100) : 0;

  const closedRows = closed.map(d => ({
    name: d.name,
    date: lastByNick[d.name] || '',
    // Fallback на тело (d.amount), если выплат нет (напр. закрыли списанием)
    sum: paidByNick[d.name] || d.amount,
  })).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const closedSum = closedRows.reduce((s, r) => s + r.sum, 0);

  // Выплаты: новые сверху (при равной дате — порядок из таблицы)
  const pays = D.payments.map((p, i) => ({ p, i })).sort((a, b) => {
    const da = String(a.p.date || ''), db = String(b.p.date || '');
    if (da !== db) return da < db ? 1 : -1;
    return a.i - b.i;
  }).map(x => x.p);

  // Время сборки. Проценты считаются в браузере от ТЕКУЩЕГО времени, поэтому
  // даже старые данные выглядят живыми — если сборка старше 6 часов, честно
  // пишем «данные от …».
  let built = '', stale = false;
  if (D.builtAt) {
    const iso = /[Zz]|[+-]\d{2}:?\d{2}$/.test(D.builtAt) ? D.builtAt : D.builtAt + 'Z';
    const b = new Date(iso);
    if (!isNaN(b.getTime())) {
      stale = (Date.now() - b.getTime()) / 36e5 > 6;
      built = `${pad2(b.getDate())}.${pad2(b.getMonth() + 1)} · ${pad2(b.getHours())}:${pad2(b.getMinutes())}`;
    }
  }

  return { open, closedRows, closedSum, pays, total, totalAccrued, totalPaid, reservedTotal,
           paidPct, allCount: D.debts.length, built, stale };
}

const S = {
  data: null, failed: false, sig: '',

  tab: 'open', desc: true,   // главный экран: вкладка и сортировка
  adsFmt: 'post',            // реклама: выбранный формат
  dKind: 'stars', dStar: 100, dRub: 500, dMonthly: false,   // донат
};
const scrollMem = {};        // экран → { ключ области: scrollTop }
const app = document.getElementById('app');

function cur() { return S.stack[S.stack.length - 1]; }

function snapScroll(id) {
  const o = {};
  app.querySelectorAll('[data-scroll]').forEach(el => { o[el.dataset.scroll] = el.scrollTop; });
  scrollMem[id] = o;
}

function paint(keepScroll) {
  const id = cur();
  if (keepScroll) snapScroll(id);
  const scr = SCREENS[id] || SCREENS.debts;
  app.innerHTML = scr.render(model());
  const o = scrollMem[id];
  if (o) app.querySelectorAll('[data-scroll]').forEach(el => {
    const v = o[el.dataset.scroll];
    if (v) el.scrollTop = v;
  });
  syncBackButton();
}

function go(id) {
  if (!SCREENS[id] || id === cur()) return;
  snapScroll(cur());
  S.stack.push(id);
  delete scrollMem[id];
  paint(false);
}

function back() {
  if (S.stack.length < 2) return;
  S.stack.pop();
  paint(false);   // восстановит прокрутку экрана, на который вернулись
}

let backBound = false;
function syncBackButton() {
  if (!verOk('6.1') || !tg.BackButton) return;
  try {
    if (!backBound) { tg.BackButton.onClick(back); backBound = true; }
    if (S.stack.length > 1) tg.BackButton.show(); else tg.BackButton.hide();
  } catch (e) {}
}

const ACTIONS = {
  back:   () => back(),
  home:   () => { S.stack = ['debts']; paint(false); },
  report: () => openReportBot(),
  tab:    (arg) => {
    if (S.tab === arg) return;
    tick(); S.tab = arg;
    snapScroll('debts'); delete scrollMem.debts.list;
    paint(false);
  },
  flip:   () => {
    tick(); S.desc = !S.desc;
    snapScroll('debts'); delete scrollMem.debts.list;
    paint(false);
  },
  adsFmt: (arg) => { tick(); S.adsFmt = arg; paint(true); },
  ads:    () => {
    const f = ADS.find(x => x[0] === S.adsFmt) || ADS[0];
    openTg(`${BOT}?start=${f[4]}`);
  },
  consult: () => openTg(`${BOT}?start=consult`),
  dKind:  (arg) => { tick(); S.dKind = arg === 'rub' ? 'rub' : 'stars'; paint(true); },
  dAmt:   (arg) => {
    tick();
    const n = parseInt(arg, 10);
    if (S.dKind === 'stars') S.dStar = n; else S.dRub = n;
    paint(true);
  },
  dMonthly: () => { tick(); S.dMonthly = !S.dMonthly; paint(true); },
  dPay:   () => {
    if (S.dKind === 'stars') {
      openTg(`${BOT}?start=stars_${S.dMonthly ? 'm_' : ''}${S.dStar}`);
    } else if (S.dMonthly) {
      openTg(TRIBUTE_MONTHLY[S.dRub] || TRIBUTE_MONTHLY[500]);

  },
  lintuApp:  () => openExt(lintuAppUrl()),

  pultShare: () => openTg(shareUrl(PULT_SITE, PULT_TEXT)),
  invite:    () => openTg(`${BOT}?start=invite`),
  shareChat: () => openTg(shareUrl(MINIAPP_URL, SHARE_TEXT)),
  shareStory: () => {
    if (!canStory()) return;
    try { tg.shareToStory(STORY_IMAGE_URL, { text: SHARE_TEXT }); } catch (e) {}
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el || !app.contains(el)) return;
  if (el.dataset.go) { tick(); go(el.dataset.go); return; }
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el.dataset.arg, el);
});

// ─── ЗАГРУЗКА ДАННЫХ ──────────────────────────────────────────────────────────
// Подпись данных + дата: перерисовываем, только если что-то поменялось
// (или наступил новый день — проценты подросли), чтобы не сбивать прокрутку.
function sigOf(d) { return new Date().toDateString() + '|' + JSON.stringify(d); }

async function refresh() {
  const d = await fetchFreshData();
  if (!d) return false;
  const sig = sigOf(d);
  if (sig !== S.sig) {
    S.sig = sig; S.data = d; S.failed = false;
    paint(true);
  }
  return true;
}

function init() {
  applyTheme();
  if (inTg) {
    try {
      tg.ready();
      tg.expand();
      // свои прокручиваемые списки: чтобы свайп по списку не сворачивал приложение
      if (verOk('7.7') && typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
      // Слушаем смену темы прямо во время сессии
      tg.onEvent('themeChanged', applyTheme);
    } catch (e) {}
  }
  // В обычном браузере тоже слушаем системную смену темы
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (!inTg && !FORCED_THEME) applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  // 1) Мгновенный рендер из inline-data, без сетевого запроса
  const initial = readInlineData();
  if (initial && initial.debts.length) {
    S.data = initial;
    S.sig = sigOf(initial);
    paint(false);
  } else {
    // Fallback: данных в странице нет (локальный просмотр или старая сборка)
    paint(false);
    refresh().then(ok => {
      if (!ok && !S.data) { S.failed = true; paint(true); }
    }).catch(() => { if (!S.data) { S.failed = true; paint(true); } });
  }

  // 2) Тихие фоновые обновления каждые 60 сек
  setInterval(() => { refresh().catch(() => {}); }, 60 * 1000);
}

init();
</script>
</body>
</html>
