name: build & deploy nezefir widget

on:
  # ручной запуск
  workflow_dispatch:

  # пуш в main: пересобирает и катит
  push:
    branches: [main]

  # cron каждые 15 минут — авто-обновление при правках в Google Sheet
  # (плюс проценты по кредитам пересчитываются каждый день автоматически)
  schedule:
    - cron: '*/15 * * * *'

  # внешний триггер от бота / другого webhook'а если понадобится
  repository_dispatch:
    types: [sheet-changed]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install --quiet gspread google-auth

      - name: Build dist/ from Google Sheets
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python3 scripts/build.py

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Trust target host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 45.8.98.228 >> ~/.ssh/known_hosts

      - name: Deploy to lintu-coffee.ru server (Caddy static)
        run: |
          rsync -az --delete --omit-dir-times --no-perms \
            dist/ deploy@45.8.98.228:/var/www/lintu-debts/
